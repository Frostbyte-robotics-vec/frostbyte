# Veröffentlicht die Teamseite (web/ und /news/) auf GitHub Pages – bei jedem Push auf main.
# Board, Viewer und Simulation werden bewusst nicht veröffentlicht (W-12, ADR-049); sie laufen lokal (siehe LIESMICH.md).
name: dashboard
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Teamseite in die Wurzel kopieren
        run: mkdir -p site && cp -r web/. site/
      - name: News-Seite bauen (/news/)
        run: python3 tools/news_build.py news site/news
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
