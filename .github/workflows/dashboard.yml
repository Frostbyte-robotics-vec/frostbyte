# Baut die Fortschrittsseite aus tasks/ und veröffentlicht sie auf GitHub Pages – bei jedem Push auf main.
name: dashboard
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite erzeugen
        run: python3 tools/board.py export site
      - name: Simulation bauen und Demo-Logs erzeugen
        run: |
          cmake -S test -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target frostbyte_sim
          ./build-test/frostbyte_sim --demo --seed 1 --out site/viewer/demo
          ./build-test/frostbyte_sim --demo --runs 100 --seed 1 --out out/sim
          python3 tools/sim_report.py out/sim --html site/viewer/report.html
      - name: Viewer in die Seite legen
        run: |
          cp tools/viewer/index.html tools/viewer/logparse.js tools/viewer/robots.js tools/viewer/livesim.js site/viewer/
          cp sim/sim_params.json site/viewer/sim_params.json
          cp field/field.json site/viewer/field.json
      - name: Simulationsseite /sim/ aus dem Viewer erzeugen
        run: python3 tools/sim_page.py tools/viewer/index.html site/sim/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
