# Push mit BOARD_TOKEN (fine-grained PAT des Repo-Admins, Contents: read/write): Admin-Ausnahme im Ruleset gilt, und der Push löst
# weitere Workflows aus (Website). Läuft der Token ab, Secret BOARD_TOKEN erneuern; am Workflow ändert sich nichts.
# Setzt beim Merge eines Pull Requests von ticket/<id> den Status des Tickets auf done.
# Ausnahme: needs_hw bleibt needs_hw, bis der Hardware-Test bestanden ist (S-05, tools/board.py status_after_merge).
name: board-done
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write
jobs:
  done:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'ticket/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, token: "${{ secrets.BOARD_TOKEN }}" }
      - name: Ticket-Status nach dem Merge setzen
        run: |
          ID=$(echo "${{ github.event.pull_request.head.ref }}" | sed 's#ticket/##' | tr '[:lower:]' '[:upper:]')
          python3 tools/board.py merged "$ID"
          git config user.name "frostbyte-board"
          git config user.email "board@users.noreply.github.com"
          STATUS=$(sed -n 's/^status: *//p' "tasks/$ID.md" | head -1)
          git commit -am "board: $ID $STATUS (PR #${{ github.event.pull_request.number }})" || exit 0
          # Mehrere Merges kurz hintereinander: main hat sich inzwischen bewegt -> rebase und erneut pushen.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 3))
          done
          # Erst nach dem Push prüfen: war eine Abhängigkeit noch nicht fertig (paralleler Lauf), ist das nur eine Warnung;
          # die endgültige Prüfung macht die CI auf main.
          python3 tools/board.py validate || echo "::warning::board.py validate meldet Fehler (evtl. paralleler Merge) - CI auf main prüfen"
